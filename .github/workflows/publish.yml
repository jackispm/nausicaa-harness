name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: false
        default: latest
        type: string
      release_tag:
        description: Existing version tag to publish (required when dispatched from main)
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Require a matching release tag and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Publish requires an existing version tag" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" || { echo "Checkout does not match the version tag" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          node -e 'const v = process.argv[1]; const p = require("./package.json"); const l = require("./package-lock.json"); if (p.version !== v || l.version !== v || l.packages[""].version !== v) process.exit(1)' "$version"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag commit is not on main" >&2; exit 1; }
          commit=$(git rev-parse HEAD)
          ci_state=$(gh run list --workflow ci.yml --commit "$commit" --branch main --event push --limit 1 --json status,conclusion --jq '.[0] | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
          test "$ci_state" = success || { echo "Publish requires successful main CI for $commit (got $ci_state)" >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deterministic evaluations
        run: npm run eval

      - name: Package smoke tests
        run: npm run test:smoke

      - name: Download and verify the tagged release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          package_file="nausicaa-harness-${version}.tgz"
          mkdir -p release
          gh release download "$RELEASE_TAG" --dir release --pattern "$package_file" --pattern SHA256SUMS
          test -f "release/$package_file"
          (cd release && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xOf "release/$package_file" package/package.json | node -e 'const fs = require("node:fs"); if (JSON.parse(fs.readFileSync(0, "utf8")).version !== process.argv[1]) process.exit(1)' "$version"

      - name: Publish
        run: |
          set -eu
          case "$NPM_DIST_TAG" in
            ''|*[!a-zA-Z0-9._-]*) echo "Invalid npm dist-tag" >&2; exit 1 ;;
          esac
          npm publish "./release/nausicaa-harness-${RELEASE_TAG#v}.tgz" --access public --tag "$NPM_DIST_TAG" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.tag }}
